<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBS Project Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f6fa;color:#1a1a2e;font-size:14px}
header{background:#1E3A5F;color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:11px;opacity:.7;margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:4px}
.conn{font-size:12px;opacity:.85}
.btn{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit}
.btn-white{background:#fff;color:#1E3A5F}
.btn-green{background:#27ae60;color:#fff}
.btn-blue{background:#2980b9;color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.container{max-width:1320px;margin:0 auto;padding:18px 22px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.scard{background:#fff;border-radius:10px;padding:12px 16px;border:1px solid #e8ecf0}
.scard .num{font-size:24px;font-weight:600}
.scard .lbl{font-size:11px;color:#888;margin-top:2px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tbl-wrap{background:#fff;border-radius:10px;border:1px solid #e8ecf0;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#f8f9fb;padding:9px 11px;font-size:11px;font-weight:600;color:#666;text-align:left;border-bottom:1px solid #e8ecf0;white-space:nowrap}
td{padding:0;border-bottom:1px solid #f0f2f5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
td input,td select{width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;color:#1a1a2e;padding:8px 10px;outline:none}
td input:focus,td select:focus{background:#eef4ff}
.pct-bar{height:3px;background:#e8ecf0;border-radius:2px;margin:0 10px 5px}
.pct-fill{height:100%;border-radius:2px;transition:width .3s}
.warn{font-size:10px;padding:0 10px 4px}
.warn.ov{color:#dc2626}
.warn.sn{color:#d97706}
.del-btn{background:none;border:none;cursor:pointer;color:#ddd;padding:7px 10px;font-size:14px}
.del-btn:hover{color:#e74c3c}
.links-cell{padding:6px 10px;min-height:38px}
.link-list{display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.link-item{display:flex;align-items:center;gap:4px;background:#eef4ff;border-radius:5px;padding:3px 7px}
.link-item a{font-size:11px;color:#1d4ed8;text-decoration:none;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item a:hover{text-decoration:underline}
.link-del{background:none;border:none;cursor:pointer;color:#bbb;font-size:11px;padding:0 2px;flex-shrink:0}
.link-del:hover{color:#e74c3c}
.add-link-btn{font-size:11px;color:#2980b9;background:none;border:1px dashed #b3cfec;border-radius:5px;cursor:pointer;padding:2px 8px;font-family:inherit;width:100%;text-align:left;margin-top:2px}
.add-link-btn:hover{background:#eef4ff}
.add-row-btn{width:100%;padding:9px;background:#f8f9fb;border:none;border-top:1px solid #e8ecf0;cursor:pointer;color:#888;font-size:12px;font-family:inherit;text-align:left;padding-left:14px}
.add-row-btn:hover{background:#f0f2f8;color:#1E3A5F}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:460px;max-width:95vw}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#1E3A5F}
.modal label{font-size:12px;color:#666;display:block;margin-bottom:4px;margin-top:10px}
.modal label:first-of-type{margin-top:0}
.modal input{width:100%;border:1px solid #dde1e8;border-radius:7px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.modal input:focus{border-color:#2980b9;background:#f0f6ff}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{background:#f1f3f8;color:#555;border:none;border-radius:7px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-confirm{background:#2980b9;color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.toast{position:fixed;bottom:22px;right:22px;background:#1E3A5F;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.loading{text-align:center;padding:36px;color:#aaa;font-size:13px}
.save-st{font-size:11px;color:#aaa}
</style>
</head>
<body>

<header>
  <div>
    <h1>TBS Project Tracker</h1>
    <div class="sub" id="updated-lbl">กำลังโหลด...</div>
  </div>
  <div class="header-right">
    <span><span class="dot" id="dot"></span><span class="conn" id="conn-txt">กำลังเชื่อมต่อ...</span></span>
    <button class="btn btn-white btn-sm" onclick="loadData()">รีเฟรช</button>
    <button class="btn btn-green btn-sm" onclick="saveData()">บันทึก</button>
    <button class="btn btn-blue btn-sm" onclick="exportExcel()">Export Excel</button>
  </div>
</header>

<div class="container">
  <div class="summary">
    <div class="scard"><div class="num" id="s-all" style="color:#1E3A5F">0</div><div class="lbl">โปรเจคทั้งหมด</div></div>
    <div class="scard"><div class="num" id="s-ip" style="color:#1d4ed8">0</div><div class="lbl">In Progress</div></div>
    <div class="scard"><div class="num" id="s-dn" style="color:#16a34a">0</div><div class="lbl">Done</div></div>
    <div class="scard"><div class="num" id="s-ov" style="color:#dc2626">0</div><div class="lbl">Overdue</div></div>
  </div>
  <div class="toolbar">
    <button class="btn btn-blue btn-sm" onclick="addRow()">+ เพิ่มโปรเจค</button>
    <div class="save-st" id="save-status"></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <colgroup>
        <col style="width:155px"><col style="width:105px"><col style="width:56px">
        <col style="width:100px"><col style="width:108px"><col style="width:108px">
        <col style="width:108px"><col style="width:175px"><col style="width:215px"><col style="width:36px">
      </colgroup>
      <thead>
        <tr>
          <th>โปรเจค</th><th>สถานะ</th><th>%</th><th>ผู้รับผิดชอบ</th>
          <th>วันเริ่ม</th><th>Deadline</th><th>เสร็จจริง</th>
          <th>หมายเหตุ / ปัญหา</th><th>ไฟล์ / ลิงค์แนบ</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10" class="loading">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
    <button class="add-row-btn" onclick="addRow()">+ เพิ่มโปรเจคใหม่</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>เพิ่มลิงค์แนบ</h3>
    <label>ชื่อที่แสดง</label>
    <input type="text" id="m-label" placeholder="เช่น Requirement Doc, Design File, Meeting Notes">
    <label>URL</label>
    <input type="url" id="m-url" placeholder="https://drive.google.com/...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-confirm" onclick="confirmAddLink()">เพิ่มลิงค์</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbydhU0tbBdqq7uJnX_bj2i3An2XyXyss9jTkanzR-AXuMXN3cNc4AbM5Ro1j3dGig4QlA/exec";
const SL={inprogress:'In Progress',planning:'Planning',pending:'Pending',done:'Done',blocked:'Blocked'};
const PC={inprogress:'#2980b9',planning:'#d97706',pending:'#94a3b8',done:'#16a34a',blocked:'#dc2626'};
let rows=[],dirty=false,modalRowIdx=-1;

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function setConn(ok){document.getElementById('dot').style.background=ok?'#4caf50':'#f44336';document.getElementById('conn-txt').textContent=ok?'เชื่อมต่อแล้ว':'ไม่สามารถเชื่อมต่อได้';}
function fmtDate(v){
  if(!v||v==='-'||v==='')return'-';
  const d=parseAnyDate(v);
  if(!d)return'-';
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  return`${dd}/${mm}/${yyyy}`;
}
function parseAnyDate(v){
  if(!v||v==='-'||v==='')return null;
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[y,m,d]=v.split('-');return new Date(y,m-1,d);}
  // DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){const[d,m,y]=v.split('/');return new Date(y,m-1,d);}
  // MM/DD/YYYY (Google Sheets default)
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)){const parts=v.split('/');return new Date(parts[2],parts[0]-1,parts[1]);}
  // Try native parse as fallback
  const d=new Date(v);
  return isNaN(d)?null:d;
}
function toInputDate(v){
  if(!v||v==='-'||v==='')return'';
  const d=parseAnyDate(v);
  if(!d)return'';
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  return`${d.getFullYear()}-${mm}-${dd}`;
}
function dlWarn(dl,st){
  if(!dl||st==='done')return'';
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(toInputDate(dl)||dl);d.setHours(0,0,0,0);
  const diff=Math.round((d-now)/86400000);
  if(diff<0)return`<div class="warn ov">เกิน deadline ${Math.abs(diff)} วัน</div>`;
  if(diff<=7)return`<div class="warn sn">เหลือ ${diff} วัน</div>`;
  return'';
}
function defaults(){
  return[
    {name:'TBS Informative',status:'inprogress',pct:'60',owner:'-',start:'2026-04-01',deadline:'2026-04-24',done:'',note:'รอข้อมูลที่ถูกต้องจากทีม',links:[]},
    {name:'AI Spaya',status:'inprogress',pct:'40',owner:'-',start:'2026-04-01',deadline:'2026-05-15',done:'',note:'Backend Line connected แล้ว',links:[]},
    {name:'TBS Lead Management System',status:'planning',pct:'10',owner:'Billy',start:'2026-04-01',deadline:'2026-05-31',done:'',note:'รอ requirement ครบจาก Billy',links:[]},
    {name:'TBS Admin',status:'pending',pct:'0',owner:'-',start:'',deadline:'',done:'',note:'ยังไม่เริ่ม',links:[]},
    {name:'TBS HR',status:'pending',pct:'0',owner:'-',start:'',deadline:'',done:'',note:'ยังไม่เริ่ม',links:[]},
    {name:'TBS Content',status:'pending',pct:'0',owner:'-',start:'',deadline:'',done:'',note:'ยังไม่เริ่ม',links:[]},
  ];
}

async function loadData(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="loading">กำลังโหลดข้อมูล...</td></tr>';
  try{
    const res=await fetch(`${SCRIPT_URL}?action=getAll`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    rows=data.rows.length>0?data.rows.map(r=>({...r,links:tryParse(r.links)})):defaults();
    setConn(true);render();
    document.getElementById('updated-lbl').textContent='อัปเดต: '+new Date().toLocaleString('th-TH');
    showToast('โหลดข้อมูลสำเร็จ');
  }catch(e){setConn(false);rows=defaults();render();showToast('ไม่สามารถโหลดได้ — แสดงข้อมูลเริ่มต้น');}
}

function tryParse(v){try{return JSON.parse(v||'[]');}catch{return[];}}

async function saveData(){
  document.getElementById('save-status').textContent='กำลังบันทึก...';
  const payload=rows.map(r=>({...r,links:JSON.stringify(r.links||[])}));
  try{
    const res=await fetch(`${SCRIPT_URL}?action=save&data=${encodeURIComponent(JSON.stringify(payload))}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    dirty=false;
    document.getElementById('save-status').textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH');
    showToast('บันทึกสำเร็จ');
  }catch(e){document.getElementById('save-status').textContent='บันทึกไม่สำเร็จ';showToast('บันทึกไม่สำเร็จ กรุณาลองใหม่');}
}

function markDirty(){dirty=true;document.getElementById('save-status').textContent='มีการแก้ไข — กด บันทึก';}
function upd(i,k,v){
  rows[i][k]=v;markDirty();updateSummary();
  const dw=document.getElementById(`dl-warn-${i}`);if(dw)dw.innerHTML=dlWarn(rows[i].deadline,rows[i].status);
  const bar=document.getElementById(`bar-${i}`);if(bar){bar.style.width=Math.min(100,parseInt(v)||0)+'%';bar.style.background=PC[rows[i].status]||'#2980b9';}
}
function addRow(){rows.push({name:'',status:'pending',pct:'0',owner:'',start:'',deadline:'',done:'',note:'',links:[]});render();setTimeout(()=>{const inp=document.querySelectorAll('#tbody tr:last-child td input');if(inp[0])inp[0].focus();},50);}
function delRow(i){if(!confirm('ลบโปรเจคนี้?'))return;rows.splice(i,1);markDirty();render();}

function openModal(i){modalRowIdx=i;document.getElementById('m-label').value='';document.getElementById('m-url').value='';document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('m-label').focus(),80);}
function closeModal(){document.getElementById('modal').classList.remove('open');modalRowIdx=-1;}
function confirmAddLink(){
  const label=document.getElementById('m-label').value.trim();
  let url=document.getElementById('m-url').value.trim();
  if(!url){alert('กรุณาใส่ URL');return;}
  if(!url.startsWith('http'))url='https://'+url;
  if(!rows[modalRowIdx].links)rows[modalRowIdx].links=[];
  rows[modalRowIdx].links.push({label:label||url,url});
  markDirty();closeModal();renderLinksCell(modalRowIdx);
}
function delLink(ri,li){rows[ri].links.splice(li,1);markDirty();renderLinksCell(ri);}
function renderLinksCell(i){
  const cell=document.getElementById(`links-${i}`);if(!cell)return;
  const links=rows[i].links||[];
  cell.innerHTML=`<div class="link-list">${links.map((l,li)=>`<div class="link-item"><a href="${l.url}" target="_blank" title="${l.url}">${l.label}</a><button class="link-del" onclick="delLink(${i},${li})">✕</button></div>`).join('')}</div><button class="add-link-btn" onclick="openModal(${i})">+ เพิ่มลิงค์ / ไฟล์</button>`;
}

function render(){
  const tbody=document.getElementById('tbody');tbody.innerHTML='';
  rows.forEach((r,i)=>{
    const pct=Math.min(100,Math.max(0,parseInt(r.pct)||0));
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><input value="${r.name||''}" placeholder="ชื่อโปรเจค" onchange="upd(${i},'name',this.value)"></td>
      <td style="padding:7px 10px"><select onchange="upd(${i},'status',this.value)" style="width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;padding:0;cursor:pointer">${Object.entries(SL).map(([k,v])=>`<option value="${k}"${r.status===k?' selected':''}>${v}</option>`).join('')}</select></td>
      <td><input value="${r.pct||0}" style="text-align:center" onchange="upd(${i},'pct',this.value)"><div class="pct-bar"><div class="pct-fill" id="bar-${i}" style="width:${pct}%;background:${PC[r.status]||'#2980b9'}"></div></div></td>
      <td><input value="${r.owner||''}" placeholder="-" onchange="upd(${i},'owner',this.value)"></td>
      <td><input type="date" value="${toInputDate(r.start)||''}" onchange="upd(${i},'start',this.value)"></td>
      <td><input type="date" value="${toInputDate(r.deadline)||''}" onchange="upd(${i},'deadline',this.value)"><div id="dl-warn-${i}">${dlWarn(r.deadline,r.status)}</div></td>
      <td><input type="date" value="${toInputDate(r.done)||''}" onchange="upd(${i},'done',this.value)"></td>
      <td><input value="${r.note||''}" placeholder="หมายเหตุ..." onchange="upd(${i},'note',this.value)"></td>
      <td class="links-cell" id="links-${i}"></td>
      <td><button class="del-btn" onclick="delRow(${i})">✕</button></td>`;
    tbody.appendChild(tr);
    renderLinksCell(i);
  });
  updateSummary();
}

function updateSummary(){
  document.getElementById('s-all').textContent=rows.length;
  document.getElementById('s-ip').textContent=rows.filter(r=>r.status==='inprogress').length;
  document.getElementById('s-dn').textContent=rows.filter(r=>r.status==='done').length;
  const now=new Date();now.setHours(0,0,0,0);
  document.getElementById('s-ov').textContent=rows.filter(r=>{if(!r.deadline||r.status==='done')return false;const d=new Date(toInputDate(r.deadline)||r.deadline);d.setHours(0,0,0,0);return d<now;}).length;
}

function exportExcel(){
  const data=[['TBS Project Tracker'],['อัปเดต: '+new Date().toLocaleString('th-TH')],[],
    ['โปรเจค','สถานะ','%','ผู้รับผิดชอบ','วันเริ่ม','Deadline','เสร็จจริง','หมายเหตุ','ลิงค์แนบ'],
    ...rows.map(r=>[r.name,SL[r.status]||r.status,(r.pct||0)+'%',r.owner,fmtDate(r.start),fmtDate(r.deadline),fmtDate(r.done),r.note,(r.links||[]).map(l=>`${l.label}: ${l.url}`).join('\n')])
  ];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[{wch:28},{wch:14},{wch:8},{wch:16},{wch:13},{wch:13},{wch:13},{wch:32},{wch:50}];
  XLSX.utils.book_append_sheet(wb,ws,'Tracker');
  XLSX.writeFile(wb,`TBS_Tracker_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Export Excel สำเร็จ');
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open'))confirmAddLink();});
window.addEventListener('beforeunload',e=>{if(dirty)e.returnValue='มีข้อมูลที่ยังไม่ได้บันทึก';});

loadData();
</script>
</body>
</html>
